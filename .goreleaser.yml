# Burkut - Modern Download Manager
# GoReleaser configuration for automated releases

builds:
  - id: "burkut"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm
    main: ./cmd/burkut/
    binary: burkut
    ldflags:
      - -s -w
      - -X github.com/kilimcininkoroglu/burkut/internal/version.Version={{.Version}}
      - -X github.com/kilimcininkoroglu/burkut/internal/version.Date={{.Date}}
      - -X github.com/kilimcininkoroglu/burkut/internal/version.Commit={{.ShortCommit}}

archives:
  - id: "burkut"
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
